{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tm-project
  annotations:
    # Backend routes are already mounted at /api/... (see backend/app/main.py),
    # so no rewrite is needed here — just forward the prefix as-is.
    nginx.ingress.kubernetes.io/use-regex: "false"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          # More specific path first: ingress-nginx matches by specificity
          # anyway, but this keeps the intent obvious.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.backend.serviceName }}
                port:
                  number: {{ .Values.backend.servicePort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
